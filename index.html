<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kinderfreizeit Olympiade – Live-Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ==========================================
       📐 SKALIERUNG FÜR DEN BEAMER
       Alle Schriftgrößen hängen an der Bildschirmhöhe (vh),
       damit sich die Seite automatisch an jede Auflösung anpasst.
       Der mittlere Wert bestimmt die Größe, die beiden Randwerte
       verhindern, dass es auf kleinen Handys unlesbar und auf
       großen Bildschirmen albern wird.
       Auf dem Beamer zu klein? Den vh-Wert erhöhen.
       ========================================== */
    :root {
      --fs-titel:   clamp(1.1rem,  4.2vh, 3.4rem);
      /* min(vh, vw): der Teamname richtet sich nach Hoehe UND Breite,
         damit auch lange Namen wie "Standhaftigkeit" ganz hineinpassen */
      --fs-team:    clamp(0.85rem, min(4vh, 2.1vw), 2.9rem);
      --fs-medaille: clamp(0.85rem, 3.4vh, 2.5rem);
      --fs-platz:   clamp(0.55rem, 1.7vh, 1.2rem);
      --fs-flagge:  clamp(1.5rem,  6vh,   4.5rem);
      --fs-plan:    clamp(0.85rem, 3.1vh, 2.3rem);
      --fs-uhr:     clamp(0.8rem,  2.6vh, 1.9rem);
    }

    /* Kein Scrollen – auf dem Beamer muss alles auf eine Seite passen */
    html, body { height: 100%; overflow: hidden; }

    /* Die Team-Karten teilen sich die freie Höhe gleichmäßig auf.
       Dadurch sind immer alle Teams sichtbar, egal wie viele es sind. */
    .team-karte {
      flex: 1 1 0;
      min-height: 0;
    }

    /* Teamname wird nie abgeschnitten. Reicht der Platz trotz der
       breitenabhaengigen Schriftgroesse nicht, wird umgebrochen –
       bei langen Woertern mit Silbentrennung (funktioniert durch
       lang="de" im html-Tag). */
    .team-name {
      font-size: var(--fs-team);
      line-height: 1.1;
      hyphens: auto;
      overflow-wrap: break-word;
    }

    /* Umschaltbare Ansicht: nur Tagesablauf, Medaillenspiegel weggeklappt.
       Die ID-Selektoren sind bewusst spezifischer als die Tailwind-Klassen
       am Element, damit sie deren Breitenangaben ueberschreiben. */
    body.nur-tagesablauf #spalte-medaillen { display: none; }
    body.nur-tagesablauf #spalte-plan { width: 100%; height: 100%; }

    /* Kleiner Kniff für Flaggen-Bilder, damit sie immer schön rund/eckig passen */
    .team-flag {
      font-size: var(--fs-flagge);
      width: 1.15em;
      height: 1.15em;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans">

<div class="h-full flex flex-col md:flex-row relative">

  <div id="clock"
       class="absolute top-2 right-3 font-mono bg-black/60 px-3 py-1.5 rounded-xl shadow-lg z-20 border border-gray-700"
       style="font-size: var(--fs-uhr)">
    00:00:00
  </div>

  <button id="toggle-medaillen" type="button" title="Medaillenspiegel ein- oder ausblenden"
          class="absolute top-2 left-3 z-30 font-medium bg-black/60 hover:bg-black/80 px-3 py-1.5 rounded-xl shadow-lg border border-gray-700 transition-colors cursor-pointer"
          style="font-size: var(--fs-uhr)">
    🏅 ausblenden
  </button>

  <div id="spalte-medaillen" class="w-full md:w-1/2 h-1/2 md:h-full min-h-0 flex flex-col p-2 md:p-6 border-b md:border-b-0 md:border-r border-gray-700">
    <h1 class="text-center font-extrabold tracking-tight flex-shrink-0 pr-28 md:pr-0"
        style="font-size: var(--fs-titel)">
      🏅 Medaillenspiegel
    </h1>

    <div id="scoreboard" class="flex-1 min-h-0 flex flex-col gap-1.5 md:gap-3 mt-2 md:mt-4 w-full max-w-5xl mx-auto">
      <p class="text-center animate-pulse self-center" style="font-size: var(--fs-plan)">Lade Medaillendaten...</p>
    </div>
  </div>

  <div id="spalte-plan" class="w-full md:w-1/2 h-1/2 md:h-full min-h-0 flex flex-col bg-gray-800 p-2 md:p-6">
    <h2 class="text-center font-bold text-gray-200 flex-shrink-0 pr-28 md:pr-32"
        style="font-size: var(--fs-titel)">
      📅 Tagesablauf
    </h2>

    <div id="schedule" class="flex-1 min-h-0 flex flex-col justify-center gap-1 md:gap-2 mt-2 md:mt-4 w-full max-w-4xl mx-auto overflow-hidden">
      <p class="text-center animate-pulse text-gray-400" style="font-size: var(--fs-plan)">Lade Zeitplan...</p>
    </div>
  </div>

</div>

<script>
// ==========================================
// 🎨 TEAM-DESIGN KONFIGURATION
// Hier kannst du Namen, Farben und Flaggen anpassen
// ==========================================
const TEAM_CONFIG = {
  "Vertrauen":    { color: "bg-blue-600 text-white", flag: "🏆" },
  "Freude":    { color: "bg-yellow-400 text-black", flag: "🏆" },
  "Standhaftigkeit": { color: "bg-gray-950 text-white border border-gray-600", flag: "🏆" },
  "Hoffnung":    { color: "bg-green-600 text-white", flag: "🏆" },
  "Liebe":     { color: "bg-red-600 text-white", flag: "🏆" },
  // Falls ein Teamname im Sheet nicht gefunden wird, nutzt er das hier:
  "Standard":     { color: "bg-gray-700 text-white", flag: "🏅" }
};

// URLs deiner Google Sheets (CSV)
const MEDAL_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTl8ONEJhICDqDwsal3S1JazhwpI80LhIDD3MdpDiW1T4MJlL8RzX9k4Pq703VY12qRJpzOeZcpD8ZV/pub?gid=0&single=true&output=csv';
const SCHEDULE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTl8ONEJhICDqDwsal3S1JazhwpI80LhIDD3MdpDiW1T4MJlL8RzX9k4Pq703VY12qRJpzOeZcpD8ZV/pub?gid=1373310417&single=true&output=csv';

// ==========================================
// LOGIK (Ab hier nichts mehr ändern nötig)
// ==========================================

function parseCSV(text) {
  return text.split('\n')
             .map(line => line.split(',').map(cell => cell.trim()))
             .filter(row => row.length > 0 && row[0] !== "");
}

async function updateDashboard() {
  try {
    // 1. MEDAILLEN DATEN LADEN
    const medalResponse = await fetch(MEDAL_CSV_URL);
    const medalText = await medalResponse.text();
    const medalRows = parseCSV(medalText).slice(1);

    const teams = medalRows.map(row => ({
      name: row[0],
      gold: parseInt(row[1]) || 0,
      silver: parseInt(row[2]) || 0,
      bronze: parseInt(row[3]) || 0
    }));

    // Sortieren (Gold > Silber > Bronze)
    teams.sort((a, b) => (b.gold - a.gold) || (b.silver - a.silver) || (b.bronze - a.bronze));

    const scoreboardContainer = document.getElementById('scoreboard');
    scoreboardContainer.innerHTML = teams.map((team, index) => {
      const config = TEAM_CONFIG[team.name] || TEAM_CONFIG["Standard"];

      const flagContent = config.flag.startsWith('http')
        ? `<img src="${config.flag}" class="team-flag rounded-lg">`
        : `<div class="team-flag">${config.flag}</div>`;

      return `
        <div class="team-karte flex justify-between items-center gap-2 ${config.color} rounded-2xl px-3 md:px-6 shadow-xl transition-all duration-500">
          <div class="flex items-center gap-2 md:gap-5 min-w-0">
            ${flagContent}
            <div class="min-w-0">
              <span class="opacity-70 block font-mono leading-none" style="font-size: var(--fs-platz)">${index + 1}. Platz</span>
              <h2 class="team-name font-bold">${team.name}</h2>
            </div>
          </div>
          <div class="flex gap-2 md:gap-6 font-black bg-black/20 px-2 py-1 md:px-5 md:py-3 rounded-2xl backdrop-blur-sm border border-white/10 flex-shrink-0"
               style="font-size: var(--fs-medaille)">
            <span title="Gold">🥇 ${team.gold}</span>
            <span title="Silber" class="opacity-90">🥈 ${team.silver}</span>
            <span title="Bronze" class="opacity-80">🥉 ${team.bronze}</span>
          </div>
        </div>
      `;
    }).join('');

    // 2. ZEITPLAN LADEN (Jetzt ohne Uhrzeit)
    const scheduleResponse = await fetch(SCHEDULE_CSV_URL);
    const scheduleText = await scheduleResponse.text();
    const scheduleRows = parseCSV(scheduleText).slice(1);

    const scheduleContainer = document.getElementById('schedule');
    scheduleContainer.innerHTML = scheduleRows.map(row => `
      <div class="border-b border-gray-600 pb-1 md:pb-3 text-center">
        <span class="text-gray-200 font-medium" style="font-size: var(--fs-plan)">${row[0]}</span>
      </div>
    `).join('');

  } catch (error) {
    console.error("Fehler:", error);
  }
}

function updateClock() {
  document.getElementById('clock').innerText = new Date().toLocaleTimeString('de-DE');
}

// Medaillenspiegel ein-/ausblenden
const toggleButton = document.getElementById('toggle-medaillen');
toggleButton.addEventListener('click', () => {
  const istVersteckt = document.body.classList.toggle('nur-tagesablauf');
  toggleButton.textContent = istVersteckt ? '🏅 einblenden' : '🏅 ausblenden';
});

updateDashboard();
updateClock();
setInterval(updateClock, 1000);
setInterval(updateDashboard, 30000); // Alle 30 Sek neu laden
</script>
</body>
</html>
