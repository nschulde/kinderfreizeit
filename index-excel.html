<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kinderfreizeit Olympiade – Live-Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    /* Kleiner Kniff für Flaggen-Bilder, damit sie immer schön rund/eckig passen */
    .team-flag {
      width: 3rem;
      height: 3rem;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    @media (min-width: 768px) {
      .team-flag { width: 5rem; height: 5rem; font-size: 3.5rem; }
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

<div class="flex flex-col md:flex-row min-h-screen relative">

  <div id="clock" class="absolute top-4 right-4 text-2xl md:text-4xl font-mono bg-black/60 px-6 py-3 rounded-xl shadow-lg z-20 border border-gray-700">
    00:00:00
  </div>

  <div class="w-full md:w-1/2 p-4 md:p-12 flex flex-col justify-center border-b md:border-b-0 md:border-r border-gray-700">
    <h1 class="text-3xl md:text-6xl font-extrabold mb-8 md:mb-12 text-center pt-12 md:pt-0 tracking-tight">
      🏅 Medaillenspiegel
    </h1>

    <div id="scoreboard" class="space-y-4 md:space-y-6 w-full max-w-md md:max-w-3xl mx-auto">
      <p class="text-center animate-pulse text-xl">Lade Medaillendaten...</p>
    </div>
  </div>

  <div class="w-full md:w-1/2 bg-gray-800 p-4 md:p-12 flex flex-col justify-center">
    <h2 class="text-3xl md:text-5xl font-bold mb-8 md:mb-12 text-center pt-8 md:pt-0 text-gray-200">
      📅 Tagesablauf
    </h2>

    <div id="schedule" class="space-y-3 md:space-y-5 text-xl md:text-3xl w-full max-w-md md:max-w-3xl mx-auto">
      <p class="text-center animate-pulse text-xl text-gray-400">Lade Zeitplan...</p>
    </div>
  </div>

</div>

<script>
// ==========================================
// 🎨 TEAM-DESIGN KONFIGURATION
// Hier kannst du Namen, Farben und Flaggen anpassen
// ==========================================
const TEAM_CONFIG = {
  "Blau":    { color: "bg-blue-600 text-white", flag: "🏆" },
  "Gelb":    { color: "bg-yellow-400 text-black", flag: "🏆" },
  "Schwarz": { color: "bg-gray-950 text-white border border-gray-600", flag: "🏆" },
  "Grün":    { color: "bg-green-600 text-white", flag: "🏆" },
  "Rot":     { color: "bg-red-600 text-white", flag: "🏆" },
  // Falls ein Teamname in der Excel nicht gefunden wird, nutzt er das hier:
  "Standard":     { color: "bg-gray-700 text-white", flag: "🏅" }
};

// ==========================================
// 📗 EXCEL-QUELLE (OneDrive)
// Eine Arbeitsmappe, zwei Tabellenblätter.
// Den Freigabelink bekommst du in OneDrive über "Teilen" → "Link kopieren",
// Zugriff muss auf "Jeder mit dem Link" stehen.
// ==========================================
const ONEDRIVE_SHARE_URL = 'HIER_DEINEN_ONEDRIVE_FREIGABELINK_EINFUEGEN';

// Namen der Tabellenblätter. Wird ein Name nicht gefunden,
// greift die Position: erstes Blatt = Medaillen, zweites = Zeitplan.
const SHEET_MEDALS = 'Medaillen';
const SHEET_SCHEDULE = 'Zeitplan';

// ==========================================
// LOGIK (Ab hier nichts mehr ändern nötig)
// ==========================================

// OneDrive-Freigabelink in die Adresse umrechnen, die den Dateiinhalt liefert.
function buildContentUrl(shareUrl) {
  const b64 = btoa(shareUrl).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
  return `https://api.onedrive.com/v1.0/shares/u!${b64}/root/content`;
}

// Blatt per Name holen, sonst per Position.
function getRows(workbook, name, fallbackIndex) {
  const sheetName = workbook.SheetNames.includes(name)
    ? name
    : workbook.SheetNames[fallbackIndex];

  if (!sheetName) return [];

  return XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, blankrows: false })
    .map(row => row.map(cell => String(cell ?? '').trim()))
    .filter(row => row.length > 0 && row[0] !== "");
}

function showError(message) {
  const html = `<p class="text-center text-lg text-red-400">⚠️ ${message}</p>`;
  document.getElementById('scoreboard').innerHTML = html;
  document.getElementById('schedule').innerHTML = html;
}

async function updateDashboard() {
  try {
    // 1. ARBEITSMAPPE LADEN (ein Download für beide Blätter)
    const response = await fetch(buildContentUrl(ONEDRIVE_SHARE_URL), { cache: 'no-store' });
    if (!response.ok) throw new Error(`Server antwortet mit ${response.status}`);

    const workbook = XLSX.read(await response.arrayBuffer(), { type: 'array' });

    // 2. MEDAILLEN AUFBEREITEN (Zeile 1 ist die Kopfzeile)
    const medalRows = getRows(workbook, SHEET_MEDALS, 0).slice(1);

    const teams = medalRows.map(row => ({
      name: row[0],
      gold: parseInt(row[1]) || 0,
      silver: parseInt(row[2]) || 0,
      bronze: parseInt(row[3]) || 0
    }));

    // Sortieren (Gold > Silber > Bronze)
    teams.sort((a, b) => (b.gold - a.gold) || (b.silver - a.silver) || (b.bronze - a.bronze));

    const scoreboardContainer = document.getElementById('scoreboard');
    scoreboardContainer.innerHTML = teams.map((team, index) => {
      const config = TEAM_CONFIG[team.name] || TEAM_CONFIG["Standard"];

      const flagContent = config.flag.startsWith('http')
        ? `<img src="${config.flag}" class="team-flag rounded-lg">`
        : `<div class="team-flag">${config.flag}</div>`;

      return `
        <div class="flex justify-between items-center ${config.color} rounded-2xl p-4 md:p-6 shadow-xl transition-all duration-500">
          <div class="flex items-center gap-4 md:gap-6">
            ${flagContent}
            <div>
              <span class="text-xs md:text-lg opacity-70 block font-mono">${index + 1}. Platz</span>
              <h2 class="text-xl md:text-4xl font-bold truncate leading-tight">${team.name}</h2>
            </div>
          </div>
          <div class="flex gap-3 md:gap-8 text-lg md:text-4xl font-black bg-black/20 px-4 py-2 md:px-6 md:py-4 rounded-2xl backdrop-blur-sm border border-white/10">
            <span title="Gold">🥇 ${team.gold}</span>
            <span title="Silber" class="opacity-90">🥈 ${team.silver}</span>
            <span title="Bronze" class="opacity-80">🥉 ${team.bronze}</span>
          </div>
        </div>
      `;
    }).join('');

    // 3. ZEITPLAN AUFBEREITEN (Jetzt ohne Uhrzeit)
    const scheduleRows = getRows(workbook, SHEET_SCHEDULE, 1).slice(1);

    const scheduleContainer = document.getElementById('schedule');
    scheduleContainer.innerHTML = scheduleRows.map(row => `
      <div class="border-b border-gray-600 pb-3 md:pb-5 text-center md:text-left">
        <span class="text-gray-200 font-medium">${row[0]}</span>
      </div>
    `).join('');

  } catch (error) {
    console.error("Fehler:", error);
    showError(`Daten konnten nicht geladen werden (${error.message}). Nächster Versuch in 30 Sekunden.`);
  }
}

function updateClock() {
  document.getElementById('clock').innerText = new Date().toLocaleTimeString('de-DE');
}

updateDashboard();
updateClock();
setInterval(updateClock, 1000);
setInterval(updateDashboard, 30000); // Alle 30 Sek neu laden
</script>
</body>
</html>
